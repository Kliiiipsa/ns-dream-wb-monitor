<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS dream — мониторинг Wildberries</title>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7;
    --surface:#fcfcfb;
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --muted:#898781;
    --grid:#e1e0d9;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,0.10);
    --accent:#2a78d6;
    --accent-soft:#cde2fb;
    --up:#006300;
    --up-bg:#e2f2e2;
    --down:#d03b3b;
    --down-bg:#fbe7e7;
    --warn:#b96a00;
    --warn-bg:#fdf0d9;
    --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.06);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:20px 16px 48px}

  /* Шапка */
  header{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 14px; margin:6px 0 18px}
  h1{font-size:22px; font-weight:700; margin:0; letter-spacing:-.01em}
  .sub{color:var(--ink-2); font-size:13.5px}
  .badge{
    display:inline-block; background:var(--accent-soft); color:#184f95;
    border-radius:999px; padding:2px 10px; font-size:12.5px; font-weight:600;
    vertical-align:2px;
  }

  /* Переключатель периода */
  .periods{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px}
  .pbtn{
    border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
    border-radius:10px; padding:8px 16px; font-size:14px; font-weight:600;
    cursor:pointer; box-shadow:var(--shadow); transition:background .12s,color .12s;
  }
  .pbtn:hover{background:#f1f1ee}
  .pbtn.active{background:var(--accent); border-color:var(--accent); color:#fff}

  /* Карточки */
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px}
  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:400px){.cards{grid-template-columns:1fr}}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .card .lbl{font-size:12.5px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
  .card .val{font-size:26px; font-weight:700; margin:2px 0 4px; letter-spacing:-.01em}
  .card .val small{font-size:15px; font-weight:600; color:var(--ink-2)}
  .delta{font-size:13px; font-weight:600; border-radius:8px; padding:2px 8px; display:inline-block}
  .delta.up{color:var(--up); background:var(--up-bg)}
  .delta.down{color:var(--down); background:var(--down-bg)}
  .delta.flat{color:var(--ink-2); background:#efefec}
  .delta .arr{font-size:12px}
  .cmp{font-size:12px; color:var(--muted); margin-top:4px}

  /* Секции */
  section.panel{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .panel h2{font-size:15px; margin:0 0 10px; font-weight:700}
  .panel h2 .note{font-weight:500; color:var(--muted); font-size:12.5px}

  /* График */
  #chartBox{position:relative}
  #chart{width:100%; display:block}
  .tip{
    position:absolute; pointer-events:none; background:#fff; border:1px solid var(--border);
    box-shadow:var(--shadow); border-radius:8px; padding:6px 9px; font-size:12.5px;
    white-space:nowrap; display:none; z-index:5;
  }
  .tip b{font-size:13px}
  .legend{display:flex; gap:14px; font-size:12.5px; color:var(--ink-2); margin-top:6px; flex-wrap:wrap}
  .legend .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}

  /* Таблица */
  .tbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
  .search{
    flex:1 1 220px; max-width:320px; border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; font-size:14px; background:#fff; color:var(--ink);
  }
  .search:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
  .twrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; min-width:680px; font-variant-numeric:tabular-nums}
  th,td{padding:7px 10px; text-align:right; font-size:13.5px; border-bottom:1px solid var(--grid); white-space:nowrap}
  th{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; user-select:none; position:sticky; top:0; background:var(--surface)}
  th:hover{color:var(--ink)}
  th .s{font-size:10px}
  th:first-child,td:first-child{text-align:left}
  td.good{background:var(--up-bg); color:var(--up); font-weight:600}
  td.bad{background:var(--down-bg); color:var(--down); font-weight:600}
  .wmark{color:var(--warn); background:var(--warn-bg); border-radius:6px; padding:1px 7px; font-weight:600}
  tr.dead td{background:#fbe7e7}
  tr.dead td:first-child{color:var(--down); font-weight:700}
  .rowcount{font-size:12.5px; color:var(--muted)}

  /* Разбор */
  .claude-date{font-size:12.5px; color:var(--muted); margin-bottom:6px}
  .claude-text{font-size:14.5px; color:var(--ink); white-space:pre-wrap; line-height:1.55}

  /* Служебное */
  #status{padding:40px 0; text-align:center; color:var(--muted); font-size:14px}
  .err{color:var(--down)}
  footer{color:var(--muted); font-size:12px; margin-top:8px; text-align:center}
  .spin{
    display:inline-block; width:18px; height:18px; border:2.5px solid var(--grid);
    border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite;
    vertical-align:-4px; margin-right:8px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NS dream — мониторинг Wildberries</h1>
    <span id="fbsBadge" class="badge" style="display:none"></span>
    <span class="sub" id="updated"></span>
  </header>

  <div id="status"><span class="spin"></span>Загружаю данные из таблицы…</div>

  <div id="app" style="display:none">
    <div class="periods" id="periods">
      <button class="pbtn" data-n="1">Анализ 1 дня</button>
      <button class="pbtn active" data-n="7">Анализ 7 дней</button>
      <button class="pbtn" data-n="30">Анализ 30 дней</button>
    </div>

    <div class="cards" id="cards"></div>

    <section class="panel">
      <h2>Заказы по дням <span class="note" id="chartNote"></span></h2>
      <div id="chartBox">
        <svg id="chart"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend" id="chartLegend"></div>
    </section>

    <section class="panel">
      <h2>Товары за период</h2>
      <div class="tbar">
        <input class="search" id="search" type="search" placeholder="Поиск по артикулу…">
        <span class="rowcount" id="rowcount"></span>
      </div>
      <div class="twrap">
        <table id="tbl">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Разбор от Claude</h2>
      <div class="claude-date" id="claudeDate"></div>
      <div class="claude-text" id="claudeText">—</div>
    </section>

    <footer>Данные подтягиваются из опубликованной Google-таблицы при каждом открытии страницы.</footer>
  </div>
</div>

<script>
"use strict";
/* ========= НАСТРОЙКИ ========= */
var PUB_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSXFR70at1ToAW0-aWSGlV9hZDetbf12DiDKlVtmL1Vmwv2ydlurKQe-ECrEuF9tKfDk8RAcr8MdeIG/pub";
var DATA_CSV_URL = PUB_BASE + "?gid=0&single=true&output=csv";           // лист «Данные (по дням)»
var ANALYSIS_CSV_URL = PUB_BASE + "?gid=2085265637&single=true&output=csv"; // лист «Анализ»
var FBS_DATE = "2026-07-27";                // дата перехода на ФБС (config!B1)
var TZ = "Europe/Moscow";

/* ========= УТИЛИТЫ ========= */
function parseCSV(text){
  var rows=[], row=[], cur="", inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(cur); cur=""; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function num(s){
  if(s==null) return 0;
  s=String(s).replace(/ /g,"").replace(/\s/g,"").replace(",",".");
  var v=parseFloat(s);
  return isNaN(v)?0:v;
}
function fmtInt(v){ return Math.round(v).toLocaleString("ru-RU"); }
function fmt1(v){ return v.toLocaleString("ru-RU",{minimumFractionDigits:1,maximumFractionDigits:1}); }
function fmtMoney(v){ return fmtInt(v)+" ₽"; }
function fmtMoneyShort(v){
  if(Math.abs(v)>=1e6) return (v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млн ₽";
  if(Math.abs(v)>=1e4) return fmtInt(v/1e3)+" тыс ₽";
  return fmtInt(v)+" ₽";
}
function dShort(iso){ var p=iso.split("-"); return p[2]+"."+p[1]; }
function dRu(iso){ var p=iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
function addDays(iso,n){
  var p=iso.split("-").map(Number);
  var d=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));
  return d.toISOString().slice(0,10);
}
function todayISO(){
  return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ========= ЗАГРУЗКА ========= */
var RAW=[];        // {date, sku, orders, ordersRub, cancels, buyouts, buyoutsRub, returns}
var ANALYSIS=[];   // {date, slice, text}
var N=7;           // выбранный период
var sortKey="rub", sortDir=-1, searchQ="";

function bust(u){ return u + (u.indexOf("?")>=0?"&":"?") + "cb=" + Date.now(); }

Promise.all([
  fetch(bust(DATA_CSV_URL)).then(function(r){ if(!r.ok) throw new Error("данные: HTTP "+r.status); return r.text(); }),
  fetch(bust(ANALYSIS_CSV_URL)).then(function(r){ if(!r.ok) throw new Error("анализ: HTTP "+r.status); return r.text(); })
]).then(function(res){
  var rows=parseCSV(res[0]);
  // первые 2 строки — шапка (en-ключи + русские названия)
  for(var i=2;i<rows.length;i++){
    var r=rows[i];
    if(!r || !r[0] || !/^\d{4}-\d{2}-\d{2}$/.test(r[0].trim())) continue;
    RAW.push({
      date:r[0].trim(), sku:(r[1]||"").trim(),
      orders:num(r[2]), ordersRub:num(r[3]), cancels:num(r[4]),
      buyouts:num(r[5]), buyoutsRub:num(r[6]), returns:num(r[7])
    });
  }
  var arows=parseCSV(res[1]);
  for(var j=1;j<arows.length;j++){
    var a=arows[j];
    if(!a || !a[0] || !a[2]) continue;
    ANALYSIS.push({date:a[0].trim(), slice:(a[1]||"").trim(), text:a[2]});
  }
  if(!RAW.length) throw new Error("в таблице не нашлось строк с данными");
  init();
}).catch(function(e){
  document.getElementById("status").innerHTML =
    '<span class="err">Не удалось загрузить данные: '+esc(e.message)+
    '</span><br><span style="font-size:13px">Проверьте, что таблица опубликована в интернете, и обновите страницу.</span>';
});

/* ========= РАСЧЁТЫ ========= */
function periodDates(n){
  // последний полный день = максимальная дата в данных, исключая сегодня
  var today=todayISO();
  var maxDate="";
  for(var i=0;i<RAW.length;i++){
    if(RAW[i].date<today && RAW[i].date>maxDate) maxDate=RAW[i].date;
  }
  var cur=[], prev=[];
  for(var k=0;k<n;k++) cur.unshift(addDays(maxDate,-k));
  for(var m=0;m<n;m++) prev.unshift(addDays(maxDate,-n-m));
  return {cur:cur, prev:prev, last:maxDate};
}
function aggregate(dates){
  var set={}; dates.forEach(function(d){set[d]=1;});
  var t={orders:0, ordersRub:0, buyouts:0, buyoutsRub:0, returns:0, cancels:0};
  var bySku={}, byDay={};
  dates.forEach(function(d){ byDay[d]={orders:0, ordersRub:0}; });
  RAW.forEach(function(r){
    if(!set[r.date]) return;
    t.orders+=r.orders; t.ordersRub+=r.ordersRub; t.buyouts+=r.buyouts;
    t.buyoutsRub+=r.buyoutsRub; t.returns+=r.returns; t.cancels+=r.cancels;
    var s=bySku[r.sku]||(bySku[r.sku]={orders:0, ordersRub:0, buyouts:0, returns:0});
    s.orders+=r.orders; s.ordersRub+=r.ordersRub; s.buyouts+=r.buyouts; s.returns+=r.returns;
    byDay[r.date].orders+=r.orders; byDay[r.date].ordersRub+=r.ordersRub;
  });
  return {t:t, bySku:bySku, byDay:byDay};
}
function pct(cur,prev){
  if(prev===0) return (cur===0? 0 : null); // null = «новое», базы не было
  return (cur-prev)/prev*100;
}

/* ========= РЕНДЕР ========= */
function init(){
  var today=todayISO();
  var maxAll="";
  RAW.forEach(function(r){ if(r.date>maxAll) maxAll=r.date; });
  document.getElementById("updated").textContent="данные по "+dRu(maxAll);
  var b=document.getElementById("fbsBadge");
  b.textContent="ФБС с "+dShort(FBS_DATE);
  b.style.display="inline-block";

  document.getElementById("periods").addEventListener("click",function(e){
    var btn=e.target.closest(".pbtn"); if(!btn) return;
    N=+btn.dataset.n;
    document.querySelectorAll(".pbtn").forEach(function(x){x.classList.toggle("active",x===btn);});
    render();
  });
  document.getElementById("search").addEventListener("input",function(e){
    searchQ=e.target.value.trim().toLowerCase(); renderTable();
  });

  document.getElementById("status").style.display="none";
  document.getElementById("app").style.display="block";
  renderClaude();
  render();
}

var CUR, PREV, P;
function render(){
  P=periodDates(N);
  CUR=aggregate(P.cur); PREV=aggregate(P.prev);
  renderCards(); renderChart(); renderTable();
}

function card(lbl,valHtml,delta,invert,cmpText){
  var cls="flat", arr="→", txt="0%";
  if(delta===null){ cls="up"; arr="↑"; txt="новое"; }
  else if(Math.abs(delta)>=0.05){
    var up=delta>0;
    arr=up?"↑":"↓";
    var good=invert? !up : up;
    cls=good?"up":"down";
    txt=(up?"+":"−")+Math.abs(delta).toLocaleString("ru-RU",{maximumFractionDigits:1})+"%";
  }
  return '<div class="card"><div class="lbl">'+lbl+'</div><div class="val">'+valHtml+
    '</div><span class="delta '+cls+'"><span class="arr">'+arr+'</span> '+txt+
    '</span><div class="cmp">'+cmpText+'</div></div>';
}
function renderCards(){
  var n=N;
  var c=CUR.t, p=PREV.t;
  var oc=c.orders/n, op=p.orders/n;
  var rc=c.ordersRub/n, rp=p.ordersRub/n;
  var bc=c.orders? c.buyouts/c.orders*100 : 0;
  var bp=p.orders? p.buyouts/p.orders*100 : 0;
  var vc=c.returns/n, vp=p.returns/n;
  var cmp="против "+(N===1? dShort(P.prev[0]) : dShort(P.prev[0])+"–"+dShort(P.prev[N-1]));
  var el=document.getElementById("cards");
  el.innerHTML =
    card("Заказы / день", fmtInt(oc)+" <small>шт</small>", pct(oc,op), false, cmp) +
    card("Выручка заказов / день", fmtMoneyShort(rc), pct(rc,rp), false, cmp) +
    card("Процент выкупа", fmt1(bc)+" <small>%</small>", (p.orders?bc-bp:null), false,
         "было "+(p.orders? fmt1(bp)+"%" : "—")+" · п.п.") +
    card("Возвраты / день", fmt1(vc)+" <small>шт</small>", pct(vc,vp), true, cmp);
  document.getElementById("chartNote").textContent =
    (N===1? dShort(P.prev[0])+" и "+dShort(P.cur[0])
          : dShort(P.prev[0])+"–"+dShort(P.cur[N-1])+" (пунктир — прошлый период)");
}

function renderChart(){
  var days=P.prev.concat(P.cur);
  var svg=document.getElementById("chart");
  var W=Math.max(svg.parentNode.clientWidth||900,320), H=230;
  var padL=44,padR=12,padT=14,padB=26;
  var iw=W-padL-padR, ih=H-padT-padB;
  var vals=days.map(function(d){
    var day=(CUR.byDay[d]||PREV.byDay[d])||{orders:0,ordersRub:0};
    return day;
  });
  var max=1; vals.forEach(function(v){ if(v.orders>max) max=v.orders; });
  max=Math.ceil(max*1.12);
  var bw=iw/days.length;
  var barW=Math.max(2,Math.min(38,bw*0.68));
  var html="";
  // сетка: 4 горизонтальные линии
  for(var g=0;g<=4;g++){
    var y=padT+ih-ih*g/4, lab=Math.round(max*g/4);
    html+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="#e1e0d9" stroke-width="1"/>';
    html+='<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#898781">'+lab.toLocaleString("ru-RU")+'</text>';
  }
  // бары
  days.forEach(function(d,i){
    var v=vals[i].orders;
    var h=Math.max(v>0?2:0, ih*v/max);
    var x=padL+bw*i+(bw-barW)/2;
    var y=padT+ih-h;
    var isPrev=i<N;
    html+='<rect data-i="'+i+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+
      '" height="'+h.toFixed(1)+'" rx="3" fill="'+(isPrev?"#9ec5f4":"#2a78d6")+'"'+
      (isPrev?' fill-opacity="0.75"':"")+'/>';
  });
  // подписи оси X (не чаще, чем помещается)
  var step=Math.ceil(days.length/ (W<520? 6 : 12));
  days.forEach(function(d,i){
    if(i%step!==0 && i!==days.length-1) return;
    var x=padL+bw*i+bw/2;
    html+='<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#898781">'+dShort(d)+'</text>';
  });
  // граница периодов
  if(days.length>2){
    var xb=padL+bw*N;
    html+='<line x1="'+xb+'" y1="'+padT+'" x2="'+xb+'" y2="'+(padT+ih)+'" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="2 3"/>';
  }
  // линия ФБС
  var fi=days.indexOf(FBS_DATE);
  if(fi>=0){
    var xf=padL+bw*fi+bw/2;
    html+='<line x1="'+xf+'" y1="'+(padT-4)+'" x2="'+xf+'" y2="'+(padT+ih)+'" stroke="#d03b3b" stroke-width="1.5" stroke-dasharray="5 4"/>';
    html+='<text x="'+(xf+5)+'" y="'+(padT+8)+'" font-size="11" font-weight="600" fill="#d03b3b">ФБС</text>';
  }
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("height",H);
  svg.innerHTML=html;

  // тултип
  var tip=document.getElementById("tip"), box=document.getElementById("chartBox");
  svg.onmousemove=function(e){
    var t=e.target;
    if(t.tagName!=="rect"){ tip.style.display="none"; return; }
    var i=+t.getAttribute("data-i"), d=days[i], v=vals[i];
    tip.innerHTML="<b>"+dRu(d)+"</b><br>Заказы: <b>"+fmtInt(v.orders)+" шт</b><br>Выручка: "+fmtMoney(v.ordersRub)+
      (i<N?'<br><span style="color:#898781">прошлый период</span>':"");
    tip.style.display="block";
    var r=box.getBoundingClientRect();
    var x=e.clientX-r.left+12, y=e.clientY-r.top-10;
    if(x+170>r.width) x-=190;
    tip.style.left=x+"px"; tip.style.top=y+"px";
  };
  svg.onmouseleave=function(){ tip.style.display="none"; };
  var lg=document.getElementById("chartLegend");
  lg.innerHTML='<span><span class="sw" style="background:#2a78d6"></span>текущий период</span>'+
    '<span><span class="sw" style="background:#9ec5f4"></span>прошлый период</span>'+
    (fi>=0?'<span><span class="sw" style="background:#d03b3b"></span>переход на ФБС</span>':"");
}

var COLS=[
  {k:"sku",  t:"Артикул",     num:false},
  {k:"orders",t:"Заказы, шт", num:true},
  {k:"opd",  t:"Заказы/день", num:true},
  {k:"rub",  t:"Выручка",     num:true},
  {k:"dyn",  t:"Динамика, %", num:true},
  {k:"buy",  t:"Выкуп, %",    num:true},
  {k:"rpd",  t:"Возвр./день", num:true}
];
function buildRows(){
  var rows=[];
  var skus={};
  Object.keys(CUR.bySku).forEach(function(s){skus[s]=1;});
  Object.keys(PREV.bySku).forEach(function(s){skus[s]=1;});
  Object.keys(skus).forEach(function(s){
    var c=CUR.bySku[s]||{orders:0,ordersRub:0,buyouts:0,returns:0};
    var p=PREV.bySku[s]||{orders:0,ordersRub:0,buyouts:0,returns:0};
    if(c.orders===0 && c.ordersRub===0 && p.orders===0 && c.returns===0) return; // пусто в обоих периодах
    rows.push({
      sku:s, orders:c.orders, opd:c.orders/N, rub:c.ordersRub,
      dyn:pct(c.orders,p.orders), buy:(c.orders? c.buyouts/c.orders*100 : null),
      rpd:c.returns/N, dead:(c.orders===0 && p.orders>0), prevOrders:p.orders
    });
  });
  return rows;
}
function renderTable(){
  var rows=buildRows();
  if(searchQ) rows=rows.filter(function(r){ return r.sku.toLowerCase().indexOf(searchQ)>=0; });
  rows.sort(function(a,b){
    var A=a[sortKey], B=b[sortKey];
    if(sortKey==="sku") return sortDir*String(A).localeCompare(String(B),"ru");
    if(A===null) A=-Infinity; if(B===null) B=-Infinity;
    return sortDir*(A-B);
  });
  var th="";
  COLS.forEach(function(c){
    var mark=sortKey===c.k? (sortDir<0?" ▼":" ▲") :"";
    th+='<th data-k="'+c.k+'">'+c.t+'<span class="s">'+mark+'</span></th>';
  });
  document.getElementById("thead").innerHTML=th;
  var tb="";
  rows.forEach(function(r){
    var dynCell, dynCls="";
    if(r.dyn===null) dynCell='<span style="color:#006300;font-weight:600">новый</span>';
    else{
      if(r.dyn>=20) dynCls="good"; else if(r.dyn<=-20) dynCls="bad";
      dynCell=(r.dyn>0?"+":"")+r.dyn.toLocaleString("ru-RU",{maximumFractionDigits:0})+"%";
    }
    var buyCell = r.buy===null? '<span style="color:#898781">—</span>'
      : (r.buy<40? '<span class="wmark">'+fmt1(r.buy)+'</span>' : fmt1(r.buy));
    var rpdCell = r.rpd>2? '<span class="wmark">'+fmt1(r.rpd)+'</span>'
      : (r.rpd>0? fmt1(r.rpd) : '<span style="color:#898781">0</span>');
    tb+='<tr'+(r.dead?' class="dead" title="Заказы упали до нуля при базе '+r.prevOrders+' шт за прошлый период"':"")+'>'+
      '<td>'+esc(r.sku)+(r.dead?" ⚠":"")+'</td>'+
      '<td>'+fmtInt(r.orders)+'</td>'+
      '<td>'+fmt1(r.opd)+'</td>'+
      '<td>'+fmtMoney(r.rub)+'</td>'+
      '<td class="'+dynCls+'">'+dynCell+'</td>'+
      '<td>'+buyCell+'</td>'+
      '<td>'+rpdCell+'</td></tr>';
  });
  document.getElementById("tbody").innerHTML=tb || '<tr><td colspan="7" style="text-align:center;color:#898781">ничего не найдено</td></tr>';
  document.getElementById("rowcount").textContent=rows.length+" товаров";
  document.getElementById("thead").onclick=function(e){
    var t=e.target.closest("th"); if(!t) return;
    var k=t.dataset.k;
    if(sortKey===k) sortDir*=-1; else { sortKey=k; sortDir=(k==="sku"?1:-1); }
    renderTable();
  };
}

function renderClaude(){
  if(!ANALYSIS.length) return;
  var last=ANALYSIS[ANALYSIS.length-1];
  ANALYSIS.forEach(function(a){ if(a.date>last.date) last=a; });
  document.getElementById("claudeDate").textContent=dRu(last.date)+(last.slice? " · срез: "+last.slice : "");
  document.getElementById("claudeText").textContent=last.text;
}

window.addEventListener("resize",function(){ if(RAW.length && document.getElementById("app").style.display!=="none") renderChart(); });
</script>
